<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puerta al Túnel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080810;
    }

    /* ── CANVAS ESTRELLAS (fondo) ── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── DECORACIÓN ── */
    .web-corner {
      position: fixed;
      width: clamp(70px, 18vw, 120px);
      height: clamp(70px, 18vw, 120px);
      pointer-events: none;
      opacity: 0.4;
      z-index: 2;
    }
    .web-corner.tl { top: 0; left: 0; }
    .web-corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .web-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .web-corner.br { bottom: 0; right: 0; transform: scale(-1, -1); }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(4, 4, 14, 0.72) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .fog {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 40%;
      background: linear-gradient(to top, rgba(100, 70, 160, 0.15) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── LUCIÉRNAGAS (fondo) ── */
    .firefly {
      position: fixed;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #f5e642;
      box-shadow: 0 0 6px 3px rgba(245, 230, 66, 0.55);
      pointer-events: none;
      z-index: 1;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 0.8; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
    }

    /* ── ESCENA CENTRAL (puerta) ── */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.8s ease;
    }
    .scene.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .intro-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(0.8rem,3vw, 1rem);
      letter-spacing: 5px;
      color: #7a6a9a;
      text-transform: uppercase;
      margin-bottom: clamp(28px, 5vh, 48px);
      opacity: 0;
      animation: fadeUp 1s 0.5s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Puerta */
    .door-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 800px;
    }

    .door-frame {
      width: clamp(110px, 22vw, 150px);
      height: clamp(180px, 36vw, 240px);
      background: #1a0f2e;
      border: 3px solid #3d2a5a;
      border-radius: 50% 50% 0 0 / 30% 30% 0 0;
      position: relative;
      box-shadow: 0 0 30px rgba(120, 70, 200, 0.18), inset 0 0 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .door-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at 50% 55%, rgba(180, 140, 255, 0.0) 0%, transparent 70%);
      transition: background 0.8s ease;
      pointer-events: none;
      z-index: 1;
    }

    .door-panel {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #251641 0%, #1a0f2e 50%, #100820 100%);
      border-radius: inherit;
      transform-origin: left center;
      transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 2px solid #3d2a5a;
      z-index: 2;
    }

    .door-panel::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(100, 70, 160, 0.3);
      border-radius: 42% 42% 0 0 / 22% 22% 0 0;
    }

    .door-panel::after {
      content: '';
      position: absolute;
      left: 50%; top: 32%;
      transform: translateX(-50%);
      width: 78%; height: 42%;
      border: 1px solid rgba(100, 70, 160, 0.2);
      border-radius: 4px;
    }

    .door-knob {
      position: absolute;
      right: clamp(14px, 4%, 20px);
      top: 50%;
      transform: translateY(-50%);
      width: clamp(10px, 2vw, 14px);
      height: clamp(10px, 2vw, 14px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c9a84c, #7a5a1a);
      box-shadow: 0 0 6px rgba(201, 168, 76, 0.5);
      transition: box-shadow 0.35s;
      z-index: 3;
    }

    .door-frame:hover .door-knob {
      box-shadow: 0 0 16px rgba(201, 168, 76, 0.95);
    }

    .door-spider {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: clamp(11px, 2.5vw, 16px);
      opacity: 0.65;
      animation: spiderSway 3s ease-in-out infinite;
      z-index: 3;
    }

    @keyframes spiderSway {
      0%, 100% { transform: translateX(-50%) rotate(-6deg); }
      50%       { transform: translateX(-50%) rotate(6deg); }
    }

    .door-step {
      width: calc(clamp(110px, 22vw, 150px) + 26px);
      height: 14px;
      background: #1a0f2e;
      border: 2px solid #3d2a5a;
      border-top: none;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
    }

    .open-hint {
      margin-top: clamp(20px, 4vh, 36px);
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(0.50rem, 1.8vw, 0.60rem);
      letter-spacing: 4px;
      color: #5a4a7a;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s 1.3s ease forwards, blink 2.8s 2.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 1; }
    }

    /* Estado abierta */
    .door-frame.open .door-panel {
      transform: perspective(700px) rotateY(-78deg);
    }
    .door-frame.open .door-glow {
      background: radial-gradient(ellipse at 50% 50%, rgba(190, 150, 255, 0.4) 0%, transparent 75%);
    }

    /* ── CANVAS DEL TÚNEL (inicialmente invisible) ── */
    #tunnel-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
    }
    #tunnel-canvas.visible {
      opacity: 1;
    }

    /* Overlay de oscurecimiento sutil para la transición (opcional) */
    .transition-overlay {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .transition-overlay.active {
      opacity: 0.5;
    }
    * { cursor: none !important; }
  </style>
</head>
<body>

  <!-- Fondo de estrellas -->
  <canvas id="stars-canvas"></canvas>
    <audio id="musica-fondo" loop>
      <source src="audio.mp3" type="audio/mpeg">
    </audio>
  <!-- Telarañas decorativas -->
  <svg class="web-corner tl" viewBox="0 0 120 120">
    <line x1="0" y1="0" x2="120" y2="120" stroke="rgba(180,159,204,0.55)" stroke-width="0.7"/>
    <line x1="0" y1="0" x2="85"  y2="120" stroke="rgba(180,159,204,0.5)"  stroke-width="0.7"/>
    <line x1="0" y1="0" x2="120" y2="65"  stroke="rgba(180,159,204,0.45)" stroke-width="0.7"/>
    <line x1="0" y1="0" x2="55"  y2="120" stroke="rgba(180,159,204,0.35)" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="30"  fill="none" stroke="rgba(180,159,204,0.4)"  stroke-width="0.6"/>
    <circle cx="0" cy="0" r="58"  fill="none" stroke="rgba(180,159,204,0.3)"  stroke-width="0.6"/>
    <circle cx="0" cy="0" r="86"  fill="none" stroke="rgba(180,159,204,0.22)" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="114" fill="none" stroke="rgba(180,159,204,0.15)" stroke-width="0.5"/>
  </svg>
  <svg class="web-corner tr" viewBox="0 0 120 120">
    <line x1="0" y1="0" x2="120" y2="120" stroke="rgba(180,159,204,0.55)" stroke-width="0.7"/>
    <line x1="0" y1="0" x2="85"  y2="120" stroke="rgba(180,159,204,0.5)"  stroke-width="0.7"/>
    <line x1="0" y1="0" x2="120" y2="65"  stroke="rgba(180,159,204,0.45)" stroke-width="0.7"/>
    <line x1="0" y1="0" x2="55"  y2="120" stroke="rgba(180,159,204,0.35)" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="30"  fill="none" stroke="rgba(180,159,204,0.4)"  stroke-width="0.6"/>
    <circle cx="0" cy="0" r="58"  fill="none" stroke="rgba(180,159,204,0.3)"  stroke-width="0.6"/>
    <circle cx="0" cy="0" r="86"  fill="none" stroke="rgba(180,159,204,0.22)" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="114" fill="none" stroke="rgba(180,159,204,0.15)" stroke-width="0.5"/>
  </svg>

  <div class="vignette"></div>
  <div class="fog"></div>

  <!-- Araña decorativa extra -->
  <div style="position:fixed;top:0;left:28%;z-index:3;pointer-events:none;animation:spiderDrop2 16s ease-in-out infinite;">
    <div style="width:1px;height:200px;background:linear-gradient(to bottom,transparent,rgba(180,159,204,0.35));margin:0 auto;"></div>
    <div style="text-align:center;font-size:18px;filter:drop-shadow(0 0 4px rgba(180,159,204,0.5));">🕷️</div>
  </div>

  <!-- Escena de la puerta -->
  <div class="scene" id="scene">
    <p class="intro-title">✦ Una Puerta Pequeña ✦</p>
    <div class="door-wrap">
      <div class="door-frame" id="door" onclick="abrirPuerta()">
        <div class="door-glow"></div>
        <div class="door-panel">
          <div class="door-spider">⚉</div>
          <div class="door-knob"></div>
        </div>
      </div>
      <div class="door-step"></div>
    </div>
    <p class="open-hint">— toca para entrar —</p>
  </div>

  <!-- Canvas del túnel (inicialmente oculto) -->
  <canvas id="tunnel-canvas"></canvas>
  <div class="transition-overlay" id="transitionOverlay"></div>
  <div id="finalFade" style="
  position: fixed;
  inset: 0;
  background: black;
  z-index: 9999;
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
"></div>
  
  <script>
    /* ==========================
       ESTRELLAS (fondo)
    ========================== */
    (function () {
      const canvas = document.getElementById('stars-canvas');
      const ctx    = canvas.getContext('2d');
      let W, H, stars = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function initStars() {
        stars = Array.from({ length: 180 }, () => ({
          x:  Math.random() * W,
          y:  Math.random() * H,
          r:  Math.random() * 1.4 + 0.3,
          a:  Math.random(),
          da: (Math.random() * 0.005 + 0.002) * (Math.random() < 0.5 ? 1 : -1)
        }));
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        stars.forEach(s => {
          s.a += s.da;
          if (s.a > 1 || s.a < 0) s.da *= -1;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(240,237,228,${s.a})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }

      resize(); initStars(); draw();
      window.addEventListener('resize', () => { resize(); initStars(); });
    })();

    /* ==========================
       LUCIÉRNAGAS
    ========================== */
    for (let i = 0; i < 18; i++) {
      const f   = document.createElement('div');
      f.className = 'firefly';
      f.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        --dx: ${(Math.random() * 200 - 100).toFixed(0)}px;
        --dy: ${(Math.random() * 200 - 100).toFixed(0)}px;
        animation-duration: ${(Math.random() * 8 + 5).toFixed(1)}s;
        animation-delay:    ${(Math.random() * 5).toFixed(1)}s;
      `;
      document.body.appendChild(f);
    }

    /* ==========================
       TÚNEL (código adaptado de tunnel.js)
    ========================== */
    const tunnelCanvas = document.getElementById('tunnel-canvas');
    let ctxTunnel, Wt, Ht, cx, cy;
    let tunnelAnimationId = null;
    let rings = [], t = 0;

    function initTunnel() {
      Wt = window.innerWidth;
      Ht = window.innerHeight;
      tunnelCanvas.width = Wt;
      tunnelCanvas.height = Ht;
      ctxTunnel = tunnelCanvas.getContext('2d');
      cx = Wt / 2;
      cy = Ht / 2;

      const RINGS = 18;
      rings = Array.from({ length: RINGS }, (_, i) => ({
        z: i / RINGS,
        phase: (i / RINGS) * Math.PI * 2
      }));
    }

    function easeInOut(x) {
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    function drawRing(progress, phase) {
      const p = (progress + 1) % 1;
      const depth = easeInOut(p);
      const r = 20 + depth * (Math.min(Wt, Ht) * 1.1);

      const alpha = p < 0.12 ? p / 0.12 : p > 0.82 ? (1 - p) / 0.18 : 1;
      if (alpha <= 0) return;

      const wobble = 20 * (1 - depth);
      const pts = 120;
      const rot = phase + p * Math.PI * 1.1;

      ctxTunnel.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const noise =
          Math.sin(a * 7 + phase * 3 + t * 0.8) * wobble +
          Math.sin(a * 13 + phase * 5 - t * 1.2) * wobble * 0.4;
        const rx = r + noise;
        const ry = r * 0.97 + noise * 0.7;
        const x = cx + Math.cos(a + rot) * rx;
        const y = cy + Math.sin(a + rot) * ry;
        i === 0 ? ctxTunnel.moveTo(x, y) : ctxTunnel.lineTo(x, y);
      }
      ctxTunnel.closePath();

      const t1 = depth;
      const br = Math.round(30 + t1 * 25);
      const bg = 0;
      const pr = Math.round(80 + t1 * 50);
      const pb = Math.round(80 + t1 * 40);

      const grd = ctxTunnel.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 1.1);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(0.45, `rgba(${br},${bg},255,${0.22 * alpha})`);
      grd.addColorStop(0.62, `rgba(${pr},0,${pb},${0.2 * alpha})`);
      grd.addColorStop(1, 'rgba(4,1,14,0)');

      ctxTunnel.fillStyle = grd;
      ctxTunnel.fill();

      const sr = Math.round(80 + t1 * 120);
      const sg = Math.round(30 + t1 * 60);
      ctxTunnel.strokeStyle = `rgba(${sr},${sg},255,${0.3 * alpha})`;
      ctxTunnel.lineWidth = 1.2 + depth * 1.5;
      ctxTunnel.stroke();
    }

    function drawDoorOnTunnel() {
      const dw = 22, dh = 36;
      const x = cx - dw / 2, y = cy - dh / 2;
      ctxTunnel.fillStyle = '#04010f';
      ctxTunnel.beginPath();
      // roundRect manual
      const radius = 2;
      ctxTunnel.moveTo(x + radius, y);
      ctxTunnel.lineTo(x + dw - radius, y);
      ctxTunnel.quadraticCurveTo(x + dw, y, x + dw, y + radius);
      ctxTunnel.lineTo(x + dw, y + dh - radius);
      ctxTunnel.quadraticCurveTo(x + dw, y + dh, x + dw - radius, y + dh);
      ctxTunnel.lineTo(x + radius, y + dh);
      ctxTunnel.quadraticCurveTo(x, y + dh, x, y + dh - radius);
      ctxTunnel.lineTo(x, y + radius);
      ctxTunnel.quadraticCurveTo(x, y, x + radius, y);
      ctxTunnel.fill();

      ctxTunnel.shadowColor = 'rgba(130,60,255,0.9)';
      ctxTunnel.shadowBlur = 18;
      ctxTunnel.strokeStyle = 'rgba(160,100,255,0.7)';
      ctxTunnel.lineWidth = 1;
      ctxTunnel.stroke();
      ctxTunnel.shadowBlur = 0;
    }

    function animateTunnel(timestamp) {
      if (!ctxTunnel) return;
      t = timestamp * 0.001;
      ctxTunnel.clearRect(0, 0, Wt, Ht);

      const speed = 0.19;
      rings.forEach(ring => {
        const progress = ((ring.z + t * speed) % 1 + 1) % 1;
        drawRing(progress, ring.phase);
      });

      drawDoorOnTunnel();
      tunnelAnimationId = requestAnimationFrame(animateTunnel);
    }

    function startTunnel() {
      if (tunnelAnimationId) cancelAnimationFrame(tunnelAnimationId);
      initTunnel();
      tunnelAnimationId = requestAnimationFrame(animateTunnel);
    }

    // Ajustar tamaño del túnel al redimensionar
    window.addEventListener('resize', () => {
      if (tunnelCanvas.classList.contains('visible')) {
        initTunnel();
      } else {
        // Si no visible, solo actualizamos variables para cuando se muestre
        Wt = window.innerWidth;
        Ht = window.innerHeight;
        if (ctxTunnel) {
          tunnelCanvas.width = Wt;
          tunnelCanvas.height = Ht;
          cx = Wt / 2;
          cy = Ht / 2;
        }
      }
    });

    /* ABRIR PUERTA Y MOSTRAR TÚNEL SUAVEMENTE */
    let transitionStarted = false;
    

function abrirPuerta() {
  if (transitionStarted) return;
  transitionStarted = true;

  const door = document.getElementById('door');
  const scene = document.getElementById('scene');
  const tunnelCanvasElem = document.getElementById('tunnel-canvas');
  const overlay = document.getElementById('transitionOverlay');
  const finalFade = document.getElementById('finalFade'); // nuevo elemento



  //0.musica de fondo
  const musica = document.getElementById('musica-fondo');
  musica.volume = 0.4;
  musica.play();
  // 1. Abrir la puerta
  door.classList.add('open');

  // 2. Iniciar el túnel (invisible aún)
  startTunnel();

  // 3. Desvanecer escena y activar overlay de entrada
  setTimeout(() => {
    scene.classList.add('fade-out');
    overlay.classList.add('active');
  }, 300);

  // 4. Mostrar túnel
  setTimeout(() => {
    tunnelCanvasElem.classList.add('visible');
  }, 600);

  // 5. Después de que el túnel se vea, ocultar el overlay de entrada para que no moleste
  setTimeout(() => {
    overlay.classList.remove('active');
  }, 2000); // a los 2 segundos (ajustable)

  // 6. Antes de redirigir, activar el FADE OUT con el nuevo elemento
  setTimeout(() => {
    finalFade.style.opacity = '1';   // comienza el oscurecimiento suave
  }, 4300); // 4.3 segundos después de abrir

  // 7. Redirigir cuando el fade lleve un rato
  setTimeout(() => {
    if (tunnelAnimationId) {
      cancelAnimationFrame(tunnelAnimationId);
      tunnelAnimationId = null;
    }
    const musica = document.getElementById('musica-fondo');
    sessionStorage.setItem('musicaTime', musica.currentTime);
    sessionStorage.setItem('entered', '1');
    window.location.href = 'index.html';
  }, 5400); // 5.4 segundos (1.1 segundos de fade antes de cambiar)
}

    // Animación de la araña extra
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spiderDrop2 {
        0%   { transform: translateY(-80px); }
        35%  { transform: translateY(160px); }
        65%  { transform: translateY(100px); }
        85%  { transform: translateY(220px); }
        100% { transform: translateY(-80px); }
      }
    `;
/* ================================================================
   CURSOR PERSONALIZADO — aguja con hilo
   ================================================================ */
const cursorAguja = document.createElement('div');
cursorAguja.id = 'cursor-aguja';
cursorAguja.innerHTML = '🪡';
cursorAguja.style.cssText = `
  position: fixed;
  font-size: 22px;
  pointer-events: none;
  z-index: 99999;
  transform: rotate(90deg);
  transition: transform 0.1s ease;
  filter: drop-shadow(0 0 4px rgba(180, 140, 255, 0.8));
`;
const hiloCanvas = document.createElement('canvas');
hiloCanvas.id = 'hilo-canvas';
hiloCanvas.style.cssText = `
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99998;
`;
hiloCanvas.width  = window.innerWidth;
hiloCanvas.height = window.innerHeight;
document.body.appendChild(hiloCanvas);
const hiloCtx = hiloCanvas.getContext('2d');

window.addEventListener('resize', () => {
  hiloCanvas.width  = window.innerWidth;
  hiloCanvas.height = window.innerHeight;
});
document.body.appendChild(cursorAguja);

const puntos = [];
const MAX_PUNTOS = 35;

document.addEventListener('mousemove', e => {
  cursorAguja.style.left = (e.clientX - 8) + 'px';
  cursorAguja.style.top  = (e.clientY - 8) + 'px';

  puntos.push({ x: e.clientX, y: e.clientY });
  if (puntos.length > MAX_PUNTOS) puntos.shift();

  hiloCtx.clearRect(0, 0, hiloCanvas.width, hiloCanvas.height);

  if (puntos.length < 2) return;

  hiloCtx.beginPath();
  hiloCtx.moveTo(puntos[0].x, puntos[0].y);

  for (let i = 1; i < puntos.length - 1; i++) {
    const mx = (puntos[i].x + puntos[i + 1].x) / 2;
    const my = (puntos[i].y + puntos[i + 1].y) / 2;
    hiloCtx.quadraticCurveTo(puntos[i].x, puntos[i].y, mx, my);
  }

  hiloCtx.strokeStyle = 'rgba(180, 140, 255, 0.7)';
  hiloCtx.lineWidth   = 1.5;
  hiloCtx.lineCap     = 'round';
  hiloCtx.stroke();
});
    document.head.appendChild(style);
  </script>
</body>
</html>
